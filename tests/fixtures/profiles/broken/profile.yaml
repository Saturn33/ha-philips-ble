# Test profile with an error: a scene that is not a command.
id: broken
name: Philips Valen series
manufacturer: Philips
model: Valen ceiling light

network: {net_key: "11111111111111111111111111111111", app_key: "00000000000000000000000000000000", iv_index: 0, ttl: 5, destination: 0xFFFF}

# Brightest first. Measured with a lux meter: 100 / 80 / 52 / 31 / 10.5 / 5 %.
brightness_levels: [100, 80, 50, 30, 10, 5]
color_temps: [2200, 2700, 3000, 4000, 6500]
# What the light does whenever mains power returns.
power_on: {power: "on", color_temp: 3000, level: 100}

commands:
  "on":              {payload: "C8 11 02 TT 03 01 41", effect: {power: "on"}}
  "off":             {payload: "C8 11 02 TT 03 00", effect: {power: "off"}}
  brightness_up:     {payload: "C8 11 02 TT 01 01 14 41", effect: {brightness_step: 1}}
  brightness_down:   {payload: "C8 11 02 TT 01 00 14 41", effect: {brightness_step: -1}}
  # SELECT: next colour temperature in a circle, and brightness back to 100 %.
  color_temperature: {payload: "C8 11 02 TT 0A", effect: {color_temp_step: 1, level: 100}}
  relax:             {payload: "C9 11 02 TT 04 01 FF 41", effect: {power: "on", color_temp: 2700, level: 50, scene: relax}}
  bright:            {payload: "C9 11 02 TT 04 02 FF 41", effect: {power: "on", color_temp: 3000, level: 100, scene: bright}}
  concentrate:       {payload: "C9 11 02 TT 04 03 FF 41", effect: {power: "on", color_temp: 4000, level: 80, scene: concentrate}}
  energise:          {payload: "C9 11 02 TT 04 04 FF 41", effect: {power: "on", color_temp: 6500, level: 50, scene: energise}}
  nightlight:        {payload: "C9 11 02 TT 04 05 FF 41", effect: {power: "on", color_temp: 2700, level: 10, scene: nightlight}}
  pairing:           {payload: "CF 11 02 TT 01 11 11 11 11 11 11"}

scenes: [relax, party]
events: ["on", "off", brightness_up, brightness_down, color_temperature, relax, bright, concentrate, energise, nightlight, pairing]

# A remote sends as the low 15 bits of its BLE address and advances its sequence by 10 per press.
remote: {address: mac_low15, sequence_step: 10}

pairing: {command: pairing, requests: 20, interval: 0.5, after_power_on: true, reset_hint: "Switch the light off and on at the wall five times quickly."}

# Unprovisioned device beacon (AD 0x2B). Offsets are into the AD value:
# uuid_prefix = beacon type 00 + first 7 UUID bytes; then the reversed BLE address;
# flag_offset = quiet-mode flag (00 active, 01 quiet: 30 min after power-on, beacon once a minute).
beacon: {ad_type: 0x2B, uuid_prefix: "0000ffffffff3101", mac_offset: 8, flag_offset: 14, active_timeout: 10, quiet_timeout: 150}
