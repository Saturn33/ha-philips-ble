name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  # Weekly: catches changes in Home Assistant's and HACS's rules between pushes.
  schedule:
    - cron: "0 3 * * 1"

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
